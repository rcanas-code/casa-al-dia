<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Casa al día</title>
<style>
:root {
  --bg: #f4f5f2; --card: #fff; --ink: #1d2320; --muted: #5d6762; --line: #dfe3de;
  --accent: #2f6f4f; --accent-ink: #fff; --accent-soft: #e3efe8;
  --warn: #9a5b00; --warn-soft: #fff1d6; --danger: #b3261e; --danger-soft: #fde7e5;
  --info-soft: #e7eef8; --radius: 14px;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
button, input, select, textarea { font: inherit; color: inherit; }
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: calc(10px + var(--safe-t)) 16px 10px; background: rgba(244,245,242,.96); border-bottom: 1px solid var(--line); }
.top h1 { font-size: 24px; margin: 0; }
main { padding: 12px 14px calc(150px + var(--safe-b)); max-width: 720px; margin: 0 auto; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-template-columns: repeat(4, 1fr);
  background: #fff; border-top: 1px solid var(--line); padding-bottom: var(--safe-b); }
.tabs button { border: 0; background: none; padding: 8px 2px 10px; min-height: 58px; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tabs button .ico { font-size: 22px; line-height: 1; }
.tabs button[aria-current="page"] { color: var(--accent); font-weight: 650; }
.fab { position: fixed; right: 16px; bottom: calc(74px + var(--safe-b)); z-index: 7; border: 0; border-radius: 999px;
  background: var(--accent); color: var(--accent-ink); font-size: 17px; font-weight: 650; padding: 14px 20px; box-shadow: 0 6px 18px rgba(0,0,0,.22); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin: 10px 0; }
.section-title { font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 22px 4px 6px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.item { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 12px; margin: 8px 0; }
button.item { cursor: pointer; }
.item .title { font-weight: 620; overflow-wrap: anywhere; }
.thumb { width: 54px; height: 54px; border-radius: 10px; object-fit: cover; background: var(--accent-soft); flex: none; display: grid; place-items: center; font-size: 24px; }
.photo-big { width: 100%; max-height: 300px; object-fit: contain; border-radius: 12px; background: #eee; }
.chip { display: inline-block; font-size: 13px; padding: 3px 9px; border-radius: 999px; background: #eef0ed; color: var(--muted); margin: 2px 4px 2px 0; white-space: nowrap; }
.chip.ok { background: var(--accent-soft); color: var(--accent); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.danger { background: var(--danger-soft); color: var(--danger); }
.chip.info { background: var(--info-soft); color: #2b4c7e; }
.chip.demo { background: #ede4fb; color: #5b3b8c; font-weight: 650; }
.btn { border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 14px; min-height: 44px; font-weight: 560; cursor: pointer; }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.danger { color: var(--danger); border-color: #f0c4c0; }
.btn.block { width: 100%; display: block; margin: 8px 0; }
.btn:disabled { opacity: .5; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.btns .btn { flex: 1 1 140px; }
.link-btn { border: 0; background: none; color: var(--accent); padding: 8px 0; font-weight: 600; cursor: pointer; min-height: 44px; }
a { color: var(--accent); }
.banner { margin: 10px 14px 0; padding: 12px 14px; border-radius: 12px; background: #ede4fb; font-size: 15px; }
.banner.error { background: var(--danger-soft); color: var(--danger); }
.empty { text-align: center; padding: 22px 12px; color: var(--muted); }
.alert-urgent { border-left: 5px solid var(--danger); }
.alert-soon { border-left: 5px solid #e0a020; }
.alert-later { border-left: 5px solid #9fb3a8; }
.estimate { background: var(--accent-soft); border-radius: 12px; padding: 12px; margin: 10px 0; }
.estimate.warn { background: var(--warn-soft); }
.estimate.danger { background: var(--danger-soft); }
.total { display: flex; justify-content: space-between; font-weight: 700; font-size: 19px; padding-top: 8px; border-top: 1px solid var(--line); margin-top: 8px; }
.line { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.line:last-child { border-bottom: 0; }
table.prices { width: 100%; border-collapse: collapse; font-size: 15px; }
table.prices td, table.prices th { padding: 7px 4px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
input[type=search] { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
.seg { display: flex; background: #e8ebe6; border-radius: 12px; padding: 3px; gap: 3px; margin: 6px 0; }
.seg label { flex: 1; text-align: center; padding: 9px 4px; border-radius: 10px; font-size: 15px; cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: #fff; font-weight: 650; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
/* Hojas (formularios) */
.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.35); display: flex; align-items: flex-end; justify-content: center; }
.sheet[hidden], .dialog[hidden] { display: none; }
.sheet-panel { background: var(--bg); width: 100%; max-width: 720px; max-height: 94vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  border-radius: 18px 18px 0 0; padding: 0 16px calc(24px + var(--safe-b)); }
.sheet-head { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; align-items: center; justify-content: space-between; padding: 14px 0 8px; }
.sheet-head h2 { margin: 0; font-size: 21px; }
.field { margin: 12px 0; }
.field > label, .field > .label { display: block; font-weight: 600; font-size: 15px; margin-bottom: 5px; }
.field input:not([type=checkbox]):not([type=radio]):not([type=file]), .field select, .field textarea {
  width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; min-height: 46px; font-size: 17px; }
.field textarea { min-height: 80px; }
.field .hint { font-size: 14px; color: var(--muted); margin-top: 4px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; }
.check input { width: 22px; height: 22px; margin-top: 2px; flex: none; }
.form-error { color: var(--danger); background: var(--danger-soft); padding: 10px 12px; border-radius: 10px; margin: 10px 0; }
.form-error:empty { display: none; }
.dialog { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; padding: 20px; }
.dialog-box { background: #fff; border-radius: 16px; padding: 18px; max-width: 420px; width: 100%; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(140px + var(--safe-b)); z-index: 50; background: #1d2320; color: #fff;
  padding: 10px 16px; border-radius: 12px; font-size: 15px; max-width: 90vw; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
details summary { cursor: pointer; font-weight: 600; padding: 8px 0; }
ul.plain { padding-left: 20px; margin: 6px 0; }
ul.plain li { margin: 4px 0; }

</style>
</head>
<body>
<header class="top">
  <h1 id="title">Hoy</h1>
  <button class="btn" data-act="settings" aria-label="Ajustes y respaldo">⚙︎ Ajustes</button>
</header>
<div id="banners"></div>
<main id="view" aria-live="polite"></main>
<button class="fab" id="fab" data-act="fab">＋ Añadir</button>
<nav class="tabs" aria-label="Apartados">
  <button data-tab="hoy"><span class="ico">☀︎</span>Hoy</button>
  <button data-tab="productos"><span class="ico">▦</span>Productos</button>
  <button data-tab="compra"><span class="ico">🛒</span>Compra</button>
  <button data-tab="renovaciones"><span class="ico">↻</span>Renovaciones</button>
</nav>
<div class="sheet" id="sheet" hidden><div class="sheet-panel" id="sheet-panel" role="dialog" aria-modal="true"></div></div>
<div class="dialog" id="dialog" hidden><div class="dialog-box" id="dialog-box" role="alertdialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
/* Casa al día — lógica pura (sin DOM). Se prueba con `node --test`. */
(function (root) {
  'use strict';
  var TZ = 'Europe/Madrid';

  // ---------- Fechas (cadenas 'AAAA-MM-DD', sin horas para evitar desplazamientos) ----------
  function pad(n) { return String(n).padStart(2, '0'); }
  function todayISO(now) {
    return new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' })
      .format(now || new Date());
  }
  function isISODate(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    var p = s.split('-').map(Number);
    var d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
    return d.getUTCFullYear() === p[0] && d.getUTCMonth() === p[1] - 1 && d.getUTCDate() === p[2];
  }
  function toDayNum(s) { var p = s.split('-').map(Number); return Math.round(Date.UTC(p[0], p[1] - 1, p[2]) / 86400000); }
  function fromDayNum(n) { return new Date(n * 86400000).toISOString().slice(0, 10); }
  function addDays(s, n) { return fromDayNum(toDayNum(s) + n); }
  /** Días desde a hasta b (b - a). */
  function diffDays(a, b) { return toDayNum(b) - toDayNum(a); }
  function daysInMonth(y, m0) { return new Date(Date.UTC(y, m0 + 1, 0)).getUTCDate(); }
  /** Suma meses respetando el día de referencia (31 ene + 1 mes = 28/29 feb; luego vuelve a 31 mar). */
  function addMonths(s, n, anchorDay) {
    var p = s.split('-').map(Number);
    var t = (p[1] - 1) + n;
    var y = p[0] + Math.floor(t / 12);
    var m0 = ((t % 12) + 12) % 12;
    var day = Math.min(anchorDay || p[2], daysInMonth(y, m0));
    return y + '-' + pad(m0 + 1) + '-' + pad(day);
  }
  var FREQ_MONTHS = { mensual: 1, bimestral: 2, trimestral: 3, semestral: 6, anual: 12 };
  /** Siguiente cobro según frecuencia; null si la frecuencia no es periódica. */
  function nextChargeDate(date, freq, anchorDay) {
    if (!isISODate(date)) return null;
    if (freq === 'semanal') return addDays(date, 7);
    var m = FREQ_MONTHS[freq];
    if (!m) return null;
    return addMonths(date, m, anchorDay);
  }
  /** Coste anual estimado en céntimos (no son cargos reales). */
  function annualCostCents(amountCents, freq) {
    if (!Number.isInteger(amountCents)) return null;
    if (freq === 'semanal') return amountCents * 52;
    var m = FREQ_MONTHS[freq];
    if (!m) return null;
    return amountCents * (12 / m);
  }
  function formatDate(s) {
    if (!isISODate(s)) return '—';
    var p = s.split('-').map(Number);
    var meses = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
    return p[2] + ' ' + meses[p[1] - 1] + ' ' + p[0];
  }
  function relDays(n) {
    if (n === 0) return 'hoy';
    if (n === 1) return 'mañana';
    if (n === -1) return 'ayer';
    return n > 0 ? 'en ' + n + ' días' : 'hace ' + (-n) + ' días';
  }

  // ---------- Números y dinero (céntimos enteros) ----------
  /** Convierte '1,5' / '1.5' en número >= 0. Devuelve null si no es válido. */
  function parseNum(v) {
    if (typeof v === 'number') return Number.isFinite(v) && v >= 0 ? v : null;
    if (typeof v !== 'string') return null;
    var s = v.trim().replace(/\s/g, '');
    if (!s) return null;
    if (s.indexOf(',') >= 0 && s.indexOf('.') >= 0) s = s.replace(/\./g, '').replace(',', '.');
    else s = s.replace(',', '.');
    if (!/^\d+(\.\d+)?$/.test(s)) return null;
    var n = Number(s);
    return Number.isFinite(n) ? n : null;
  }
  /** '12,95 €' -> 1295. Sin coma flotante: se trabaja con la cadena. */
  function parseMoney(v) {
    if (typeof v === 'number') return Number.isFinite(v) && v >= 0 ? Math.round(v * 100) : null;
    if (typeof v !== 'string') return null;
    var s = v.trim().replace(/[\s€]/g, '');
    if (!s) return null;
    if (s.indexOf(',') >= 0 && s.indexOf('.') >= 0) s = s.replace(/\./g, '').replace(',', '.');
    else s = s.replace(',', '.');
    var m = /^(\d+)(?:\.(\d{1,2}))?$/.exec(s);
    if (!m) return null;
    return parseInt(m[1], 10) * 100 + (m[2] ? parseInt(m[2].padEnd(2, '0'), 10) : 0);
  }
  function formatMoney(cents, currency) {
    if (!Number.isFinite(cents)) return '—';
    try {
      return new Intl.NumberFormat('es-ES', { style: 'currency', currency: currency || 'EUR' }).format(Math.round(cents) / 100);
    } catch (e) {
      return (Math.round(cents) / 100).toFixed(2).replace('.', ',') + ' ' + (currency || '');
    }
  }
  function centsToInput(c) { return Number.isInteger(c) ? (c / 100).toFixed(2).replace('.', ',') : ''; }
  function fmtNum(n, max) {
    return new Intl.NumberFormat('es-ES', { maximumFractionDigits: max == null ? 2 : max }).format(n);
  }

  // ---------- Unidades ----------
  var UNITS = {
    g: { dim: 'masa', f: 1, label: 'g' },
    kg: { dim: 'masa', f: 1000, label: 'kg' },
    ml: { dim: 'volumen', f: 1, label: 'ml' },
    l: { dim: 'volumen', f: 1000, label: 'l' },
    ud: { dim: 'unidades', f: 1, label: 'ud.' }
  };
  function unitDim(u) { return UNITS[u] ? UNITS[u].dim : null; }
  function compatible(a, b) { return !!(UNITS[a] && UNITS[b] && UNITS[a].dim === UNITS[b].dim); }
  /** A unidad base: g, ml o ud. */
  function toBase(q, u) { return UNITS[u] && Number.isFinite(q) ? q * UNITS[u].f : null; }
  function validSize(size, unit) { return Number.isFinite(size) && size > 0 && !!UNITS[unit]; }
  function sizeLabel(size, unit) { return validSize(size, unit) ? fmtNum(size, 3) + ' ' + UNITS[unit].label : '—'; }
  /** Precio por kg, l o unidad en céntimos (número sin redondear). */
  function unitPriceCents(priceCents, size, unit) {
    if (!Number.isInteger(priceCents) || !validSize(size, unit)) return null;
    var base = toBase(size, unit);
    return UNITS[unit].dim === 'unidades' ? priceCents / base : priceCents * 1000 / base;
  }
  function unitPriceLabel(unit) {
    var d = unitDim(unit);
    return d === 'masa' ? '/kg' : d === 'volumen' ? '/l' : d === 'unidades' ? '/ud.' : '';
  }
  function formatBase(base, dim) {
    if (!Number.isFinite(base)) return '—';
    if (dim === 'masa') return base >= 1000 ? fmtNum(base / 1000, 2) + ' kg' : fmtNum(base, 0) + ' g';
    if (dim === 'volumen') return base >= 1000 ? fmtNum(base / 1000, 2) + ' l' : fmtNum(base, 0) + ' ml';
    return fmtNum(base, 2) + ' ud.';
  }

  // ---------- Existencias y previsión ----------
  /**
   * stock = { mode: 'none'|'qty'|'days', remaining, remUnit, daily, useUnit, asOf, days, from, reserves }
   * - qty: cantidad restante del envase abierto en la fecha asOf y consumo diario.
   * - days: "lo que tengo me dura X días" desde la fecha from.
   * Los envases de reserva (cerrados) se guardan aparte en reserves.
   */
  function estimate(product, today) {
    var s = (product && product.stock) || {};
    var reserves = Number.isInteger(s.reserves) && s.reserves > 0 ? s.reserves : 0;
    if (s.mode === 'qty') {
      var missing = [];
      if (!Number.isFinite(s.remaining) || s.remaining < 0 || !UNITS[s.remUnit]) missing.push('cantidad restante');
      if (!Number.isFinite(s.daily) || s.daily < 0 || !UNITS[s.useUnit]) missing.push('consumo diario');
      if (!isISODate(s.asOf)) missing.push('fecha');
      if (missing.length) return { status: 'incomplete', reason: 'Falta: ' + missing.join(', '), reserves: reserves };
      if (!compatible(s.remUnit, s.useUnit)) return { status: 'incomplete', reason: 'Unidades incompatibles entre cantidad y consumo', reserves: reserves };
      if (s.daily === 0) return { status: 'noUse', reason: 'Consumo diario 0: no se puede estimar', reserves: reserves };
      var remBase = toBase(s.remaining, s.remUnit);
      var dailyBase = toBase(s.daily, s.useUnit);
      var dim = unitDim(s.remUnit);
      var elapsed = Math.max(0, diffDays(s.asOf, today));
      var nowBase = Math.max(0, remBase - dailyBase * elapsed);
      var openEnd = addDays(s.asOf, Math.floor(remBase / dailyBase + 1e-9));
      var totalEnd = openEnd, reservesCounted = false;
      if (reserves > 0 && validSize(product.size, product.unit) && compatible(product.unit, s.remUnit)) {
        var resBase = reserves * toBase(product.size, product.unit);
        totalEnd = addDays(s.asOf, Math.floor((remBase + resBase) / dailyBase + 1e-9));
        reservesCounted = true;
      }
      return {
        status: 'ok', mode: 'qty', openEnd: openEnd, endDate: totalEnd,
        daysLeft: diffDays(today, totalEnd), openDaysLeft: diffDays(today, openEnd),
        nowLabel: formatBase(nowBase, dim), reserves: reserves, reservesCounted: reservesCounted
      };
    }
    if (s.mode === 'days') {
      if (!Number.isFinite(s.days) || s.days < 0 || !isISODate(s.from)) {
        return { status: 'incomplete', reason: 'Falta: número de días o fecha de inicio', reserves: reserves };
      }
      var end = addDays(s.from, Math.floor(s.days));
      return {
        status: 'ok', mode: 'days', openEnd: end, endDate: end, daysLeft: diffDays(today, end),
        openDaysLeft: diffDays(today, end), reserves: reserves, reservesCounted: false
      };
    }
    return { status: 'none', reserves: reserves };
  }
  /** Nivel de aviso: 'out' (estimado agotado), 'soon' (dentro del margen), 'ok' o null. */
  function stockAlert(est, warnDays) {
    if (!est || est.status !== 'ok') return null;
    if (est.daysLeft < 0) return 'out';
    if (est.daysLeft <= warnDays) return 'soon';
    return 'ok';
  }
  /** Registrar compra: solo suma envases de reserva. No toca el envase abierto. */
  function applyPurchase(product, packs) {
    if (!Number.isInteger(packs) || packs <= 0) throw new Error('Número de envases no válido');
    var s = Object.assign({}, product.stock || { mode: 'none' });
    s.reserves = (Number.isInteger(s.reserves) ? s.reserves : 0) + packs;
    return Object.assign({}, product, { stock: s });
  }
  /** Empezar un envase: usa uno de reserva (si hay y se indica) y reinicia la previsión del abierto. */
  function startPack(product, today, opts) {
    opts = opts || {};
    var s = Object.assign({}, product.stock || { mode: 'none' });
    var reserves = Number.isInteger(s.reserves) ? s.reserves : 0;
    if (opts.fromReserve && reserves > 0) s.reserves = reserves - 1;
    if (s.mode === 'qty') {
      if (!validSize(product.size, product.unit)) throw new Error('El producto no tiene contenido del envase');
      s.remaining = product.size; s.remUnit = product.unit; s.asOf = today;
      if (!UNITS[s.useUnit]) s.useUnit = product.unit;
    } else if (s.mode === 'days') {
      if (Number.isFinite(opts.days) && opts.days >= 0) s.days = opts.days;
      s.from = today;
    }
    return Object.assign({}, product, { stock: s });
  }

  // ---------- Precios y lista de compra ----------
  /** Último precio por tienda y formato (se conserva el historial completo aparte). */
  function latestPrices(prices, productId) {
    var map = {};
    (prices || []).forEach(function (p) {
      if (p.productId !== productId || !Number.isInteger(p.priceCents) || !validSize(p.size, p.unit)) return;
      var key = p.storeId + '|' + toBase(p.size, p.unit) + '|' + unitDim(p.unit);
      var cur = map[key];
      if (!cur || p.date > cur.date || (p.date === cur.date && (p.createdAt || 0) > (cur.createdAt || 0))) map[key] = p;
    });
    return Object.keys(map).map(function (k) { return map[k]; });
  }
  /** Cantidad necesaria en unidad base, o null si no se puede saber. */
  function needBase(item, product) {
    var n = item.amount;
    if (!Number.isFinite(n) || n <= 0) return null;
    if (item.needType === 'packs') {
      if (!product || !validSize(product.size, product.unit)) return null;
      return { base: n * toBase(product.size, product.unit), dim: unitDim(product.unit) };
    }
    if (item.needType === 'qty' && UNITS[item.unit]) return { base: toBase(n, item.unit), dim: unitDim(item.unit) };
    return null;
  }
  /**
   * Mejor opción entre los precios registrados: menor desembolso comprando envases completos
   * de un mismo formato en una tienda. Empate: menos sobrante, luego precio más reciente.
   */
  function bestOption(item, product, prices) {
    if (!product) return { status: 'manual' };
    var need = needBase(item, product);
    if (!need) return { status: 'noQty' };
    var all = latestPrices(prices, product.id);
    if (!all.length) return { status: 'noPrice' };

  function compressImage(file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var max = 1024, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('No se pudo leer la imagen')); };
      img.src = url;
    });
  }
  var pendingPhoto = null;
  function saveProduct(form) {
    var f = formData(form), id = form.dataset.id;
    if (!f.name) return formError(form, 'Escribe el nombre del producto.');
    var size = f.size ? L.parseNum(f.size) : null;
    if (f.size && (size === null || size <= 0)) return formError(form, 'El contenido del envase debe ser un número mayor que 0 (ej.: 1,5).');
    if (f.url && !safeUrl(f.url)) return formError(form, 'El enlace debe empezar por https:// o http://');
    var p = id ? Object.assign({}, byId('products', id)) : { id: uid(), createdAt: Date.now(), stock: { mode: 'none', reserves: 0 } };
    Object.assign(p, { name: f.name, brand: f.brand, category: f.category, size: size, unit: f.unit, url: f.url });
    var ops = [];
    if (f.photoAction === 'new' && pendingPhoto) {
      if (p.photoId) ops.push(delPhoto(p.photoId));
      p.photoId = uid(); ops.push(putPhoto(p.photoId, pendingPhoto));
    } else if (f.photoAction === 'remove' && p.photoId) { ops.push(delPhoto(p.photoId)); p.photoId = null; }
    pendingPhoto = null;
    if (id) S.products = S.products.map(function (x) { return x.id === id ? p : x; }); else S.products.push(p);
    Promise.all(ops).then(function () { return persist('products'); }).then(function () {
      toast(id ? 'Producto actualizado' : 'Producto guardado'); render(); productDetail(p.id);
    });
  }

  function savePurchase(form) {
    if (form.dataset.busy) return; // evita doble envío
    var f = formData(form), p = byId('products', form.dataset.id);
    var packs = parseInt(f.packs, 10);
    if (!Number.isInteger(packs) || packs <= 0 || String(packs) !== f.packs) return formError(form, 'Indica un número entero de envases (1 o más).');
    if (!L.isISODate(f.date)) return formError(form, 'Indica la fecha de compra.');
    var price = null;
    if (f.withPrice) {
      var pc = L.parseMoney(f.price), sz = L.parseNum(f.size);
      if (!f.storeId) return formError(form, 'Elige la tienda o desmarca «Guardar también el precio».');
      if (pc === null) return formError(form, 'Precio no válido (ej.: 12,95).');
      if (!sz) return formError(form, 'Indica el contenido del envase comprado.');
      price = { id: uid(), productId: p.id, storeId: f.storeId, priceCents: pc, size: sz, unit: f.unit, date: f.date, note: 'Precio pagado', createdAt: Date.now() };
    }
    form.dataset.busy = '1';
    var purchase = { id: uid(), productId: p.id, packs: packs, date: f.date, listItemId: form.dataset.list || null, createdAt: Date.now() };
    S.purchases.push(purchase);
    S.products = S.products.map(function (x) { return x.id === p.id ? L.applyPurchase(x, packs) : x; });
    var colls = ['products', 'purchases'];
    if (price) { S.prices.push(price); colls.push('prices'); }
    if (purchase.listItemId) {
      S.list = S.list.map(function (i) { return i.id === purchase.listItemId ? Object.assign({}, i, { bought: true, boughtAt: f.date, purchaseId: purchase.id }) : i; });
      colls.push('list');

  }

  function saveStock(form) {

    if (!Number.isInteger(reserves) || reserves < 0) return formError(form, 'Las reservas deben ser un número entero (0 o más).');

      if (!L.compatible(f.remUnit, f.useUnit)) return formError(form, 'Las unidades no son compatibles (ej.: no se pueden mezclar gramos y litros).');
      if (!L.isISODate(f.asOf)) return formError(form, 'Indica la fecha de la medida.');
      Object.assign(s, { remaining: rem, remUnit: f.remUnit, daily: daily, useUnit: f.useUnit, asOf: f.asOf });
    } else if (f.mode === 'days') {
      var d = parseInt(f.days, 10);

      Object.assign(s, { days: d, from: f.from });

    S.products = S.products.map(function (x) { return x.id === p.id ? Object.assign({}, x, { stock: s }) : x; });

  function saveListItem(form) {
    var f = formData(form), id = form.dataset.id;
    var amount = f.amount ? L.parseNum(f.amount) : null;
    if (f.amount && (amount === null || amount <= 0)) return formError(form, 'La cantidad debe ser un número mayor que 0.');
    if (f.needType === 'packs' && amount !== null && !Number.isInteger(amount)) return formError(form, 'El número de envases debe ser entero.');
    if (!f.productId && !f.name) return formError(form, 'Elige un producto o escribe un nombre.');
    var item = { id: id || uid(), productId: f.productId || null, name: f.productId ? '' : f.name, needType: f.needType, amount: amount, unit: f.needType === 'qty' ? f.unit : null, note: f.note, bought: false, createdAt: Date.now() };
    function done(msg) { persist('list').then(function () { toast(msg); closeSheet(); render(); }); }
    if (id) { S.list = S.list.map(function (x) { return x.id === id ? Object.assign({}, x, item, { createdAt: x.createdAt }) : x; }); return done('Artículo actualizado'); }
    var dup = L.findDuplicate(S.list, item);
    if (!dup) { S.list.push(item); return done('Añadido a la lista'); }
    var p = item.productId ? byId('products', item.productId) : null;
    var canSum = dup.needType === item.needType && (dup.unit === item.unit || L.compatible(dup.unit, item.unit) || item.needType === 'packs') && Number.isFinite(dup.amount) && Number.isFinite(amount);
    var btns = [{ label: 'Cancelar', value: 'cancel' }, { label: 'Sustituir cantidad', value: 'replace', cls: 'primary' }];
    if (canSum) btns.splice(1, 0, { label: 'Sumar cantidades', value: 'sum' });
    ask('<b>' + esc(p ? p.name : item.name) + '</b> ya está en la lista (' + esc(needLabel(dup, p)) + '). ¿Qué quieres hacer?', btns).then(function (v) {
      if (v === 'cancel') return;
      S.list = S.list.map(function (x) {
        if (x.id !== dup.id) return x;
        if (v === 'sum') {
          var add = item.needType === 'qty' ? L.toBase(amount, item.unit) / L.UNITS[dup.unit].f : amount;
          return Object.assign({}, x, { amount: Math.round((x.amount + add) * 1000) / 1000 });
        }
        return Object.assign({}, x, { needType: item.needType, amount: amount, unit: item.unit, note: item.note || x.note });
      });
      done('Cantidad actualizada');
    });
  }

  function saveFile(filename, data, mime) {
    var useClaude = window.claude && typeof window.claude.use === 'function';
    var p = useClaude ? window.claude.use('downloads') : Promise.resolve(null);
    return p.then(function (dl) {
      if (dl) return dl.save({ filename: filename, data: data }).then(function () { return 'saved'; });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([data], { type: mime }));
      a.download = filename; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      return 'saved';
    });
  }

  function importBackup(file) {
    var rd = new FileReader();

      var obj;
      try { obj = JSON.parse(rd.result); } catch (e) { return ask('El archivo no es un respaldo válido (no es JSON).', [{ label: 'Entendido', value: 0 }]); }
      var v = L.validateBackup(obj);
      if (!v.ok) return ask('No se puede importar:<ul class="plain">' + v.errors.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>No se ha cambiado nada.', [{ label: 'Entendido', value: 0 }]);
      var c = v.counts;
      ask('Respaldo válido' + (obj.exportedAt ? ' del ' + esc(L.formatDate(obj.exportedAt.slice(0, 10))) : '') + ': ' + c.products + ' productos, ' + c.prices + ' precios, ' + c.stores + ' tiendas, ' + c.list + ' en la lista, ' + c.renewals + ' renovaciones y ' + c.photos + ' fotos.<br><br><b>Se sustituirán todos los datos actuales de este dispositivo.</b>', [

        pendingPhoto = data; form.photoAction.value = 'new';
        $('#photo-preview').innerHTML = '<img class="photo-big" src="' + data + '" alt=""><div class="small muted">Foto lista (' + Math.round(data.length * 0.75 / 1024) + ' KB). Se guardará con el producto.</div>';
      }).catch(function (err) { $('#photo-preview').innerHTML = '<p class="form-error">' + esc(err.message) + '. Puedes guardar el producto sin foto.</p>'; });
    }
    if (t.id === 'import-input' && t.files && t.files[0]) { importBackup(t.files[0]); t.value = ''; return; }
    if (t.id === 'withPrice') { $('#price-extra').hidden = !t.checked; return; }
    var form2 = t.form;
    if (!form2) return;
    if (form2.dataset.form === 'stock' && t.name === 'mode') {
      form2.querySelectorAll('[data-mode]').forEach(function (d) { d.hidden = d.dataset.mode !== t.value; });
    }
    if (form2.dataset.form === 'list') {
      if (t.name === 'productId') form2.querySelector('[data-manual]').hidden = !!t.value;
      if (t.name === 'needType') form2.querySelector('[data-unit]').hidden = t.value !== 'qty';
    }
    if (form2.dataset.form === 'price') {
      if (t.name === 'storeId') form2.newStore.hidden = t.value !== '__new';
      if (t.name === 'productId') { var p = byId('products', t.value); if (p) { form2.size.value = numToInput(p.size); form2.unit.value = p.unit; } }
      updateUnitPreview(form2);
    }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'search') { ui.search = e.target.value; var pos = e.target.selectionStart; render(); var s = $('#search'); s.focus(); try { s.setSelectionRange(pos, pos); } catch (x) { /* */ } }
    if (e.target.form && e.target.form.dataset.form === 'price') updateUnitPreview(e.target.form);
  });
  document.addEventListener('submit', function (e) {
    var form = e.target; e.preventDefault();
    var k = form.dataset.form;
    try {
      if (k === 'product') saveProduct(form);
      else if (k === 'purchase') savePurchase(form);
      else if (k === 'start') saveStart(form);
      else if (k === 'stock') saveStock(form);
      else if (k === 'price') savePrice(form, e.submitter && e.submitter.value === 'again');
      else if (k === 'list') saveListItem(form);
      else if (k === 'renewal') saveRenewal(form);
      else if (k === 'store') {
        var n = form.name.value.trim(); if (!n) return formError(form, 'Escribe un nombre.');
        if (S.stores.some(function (s) { return s.name.toLowerCase() === n.toLowerCase(); })) return formError(form, 'Ya existe una tienda con ese nombre.');
        S.stores.push({ id: uid(), name: n, createdAt: Date.now() }); persist('stores').then(function () { render(); storesSheet(); });
      } else if (k === 'settings') {
        var w = parseInt(form.warnDays.value, 10);
        if (!Number.isInteger(w) || w < 0 || w > 120) return formError(form.parentNode, 'Indica un número de días entre 0 y 120.');
        S.settings.warnDays = w; persist('settings').then(function () { toast('Margen de aviso: ' + w + ' días'); render(); });
      }
    } catch (err) { formError(form, 'Error inesperado: ' + err.message); }
  });
  window.addEventListener('hashchange', function () { var h = location.hash.slice(1); if (TITLES[h] && h !== ui.tab) go(h); });

  // ================= Arranque =================
  function start() {
    var h = location.hash.slice(1); if (TITLES[h]) ui.tab = h;
    openDB().then(function (d) { db = d; return loadAll(); }).catch(function (e) { db = null; storageError = 'Almacenamiento no disponible: ' + (e && e.message ? e.message : e); })
      .then(function () {
        var empty = L.COLLECTIONS.every(function (c) { return !S[c].length; });
        if (empty && !S.settings.demoSeeded) return seedDemo();
      })
      .then(function () {
        if (navigator.storage && navigator.storage.persist) {
          navigator.storage.persisted().then(function (p) { return p || navigator.storage.persist(); }).then(function (p) { persisted = p; }).catch(function () { /* */ });
        }
        render();
      });
  }
  window.__casa = { S: S, photos: photos, L: L }; // para pruebas
  start();
})();

</script>
</body>
